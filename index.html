<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>王国守望</title>
<style>html,body{margin:0;height:100%;background:#101418;color:#fff5d8;font:17px system-ui,sans-serif}[hidden]{display:none!important}main{max-width:34em;margin:auto;padding:18vh 24px 30px}h1{font-size:26px}p{line-height:1.7;overflow-wrap:anywhere}button{padding:12px 22px;font-size:17px;background:#ffd05c;color:#20333f;border:0;border-radius:8px}</style>
</head><body><main id="kwProblem" hidden><h1>游戏暂时无法打开</h1><p id="kwLoad"></p><button id="kwRetry" hidden>重试</button></main>
<script>
(function(){
  'use strict';
  // A two-pixel VP8L image with transparency probes actual lossless WebP decoding.
// Shared by the launcher and diagnostics; injected inline by the offline exporter.
var kwWebPProbe;
function supportsLosslessWebP(){
  if(!kwWebPProbe)kwWebPProbe=new Promise(function(resolve){
    var image=new Image(),done=false;
    function finish(ok){if(done)return;done=true;clearTimeout(timer);image.onload=image.onerror=null;resolve(ok);}
    var timer=setTimeout(function(){finish(false);},5000);
    image.onload=function(){finish(image.naturalWidth===2&&image.naturalHeight===1);};
    image.onerror=function(){finish(false);};
    image.src='data:image/webp;base64,UklGRiIAAABXRUJQVlA4TBUAAAAvAQAAEA/wMes7JX/Fav5DGhnR/wAA';
  });
  return kwWebPProbe;
}

  // Launcher helper. Only small, verified boot files are stored here; the worker
// caches runtime assets when the game actually requests them.
function createRuntimeCache(base, network, hash) {
  'use strict';
  var supported = window.isSecureContext && 'serviceWorker' in navigator && 'caches' in window;
  var cacheName = 'kw-boot:' + base.pathname + ':v1';
  var script = new URL('hosting-cache-sw.js', base).href;
  function bounded(promise, ms) {
    return new Promise(function(resolve) {
      var timer = setTimeout(function() { resolve(null); }, ms);
      promise.then(function(value) { clearTimeout(timer); resolve(value); }, function() { clearTimeout(timer); resolve(null); });
    });
  }
  var registration = supported ? bounded(Promise.resolve().then(function() { return navigator.serviceWorker.register(script, {
    scope: base.pathname, updateViaCache: 'none'
  }); }), 3500) : Promise.resolve(null);
  async function checked(path, expected, loader) {
    var url = new URL(path, base), cache;
    if (url.origin !== base.origin || !url.pathname.startsWith(base.pathname) || /[?#]/.test(path)) throw new Error('缓存文件路径不合法');
    if ('caches' in window) {
      var local = await bounded((async function() {
        cache = await caches.open(cacheName);
        var response = await cache.match(url.href);
        if (!response) return null;
        var bytes = await response.arrayBuffer();
        if (bytes.byteLength === expected.bytes && await hash(bytes) === expected.sha256) return bytes;
        await cache.delete(url.href);
        return null;
      })(), 750);
      if (local) return local;
    }
    var bytes = await (loader || network)(url);
    if (bytes.byteLength !== expected.bytes || await hash(bytes) !== expected.sha256) throw new Error('版本文件校验失败，请稍后重试');
    // Storage is best effort. Quota/private-mode failures never prevent play.
    bounded((async function() {
      var store = cache || await caches.open(cacheName);
      await store.put(url.href, new Response(bytes));
      var keys = await store.keys();
      for (var prefix of ['game.', 'hosting-files.']) {
        var old = keys.filter(function(key) { return new URL(key.url).pathname.split('/').pop().startsWith(prefix) && key.url !== url.href; });
        for (var key of old.slice(0, Math.max(0, old.length - 1))) await store.delete(key);
      }
    })(), 1000);
    return bytes;
  }
  async function inventoryNetwork(url) {
    var ctl = new AbortController(), timer = setTimeout(function() { ctl.abort(); }, 5000);
    try {
      var response = await fetch(url, {cache: 'force-cache', credentials: 'same-origin', signal: ctl.signal});
      if (!response.ok) throw new Error('缓存清单 HTTP ' + response.status);
      return await response.arrayBuffer();
    } finally { clearTimeout(timer); }
  }
  function controller() {
    return new Promise(function(resolve) {
      function ready() {
        var worker = navigator.serviceWorker.controller;
        if (worker && worker.scriptURL === script) {
          navigator.serviceWorker.removeEventListener('controllerchange', ready);
          clearTimeout(timer); resolve(worker);
        }
      }
      var timer = setTimeout(function() { navigator.serviceWorker.removeEventListener('controllerchange', ready); resolve(null); }, 1500);
      navigator.serviceWorker.addEventListener('controllerchange', ready); ready();
    });
  }
  async function connect(release) {
    if (!supported) return {enabled: false, reason: 'unsupported'};
    return await bounded((async function() {
      var active = navigator.serviceWorker.controller;
      var results = await Promise.all([active && active.scriptURL === script ? Promise.resolve(true) : registration, checked(release.inventory, {
        sha256: release.inventory_sha256, bytes: release.inventory_bytes
      }, inventoryNetwork)]);
      if (!results[0]) return {enabled: false, reason: 'registration-unavailable'};
      var worker = await controller();
      if (!worker) return {enabled: false, reason: 'controller-unavailable'};
      return await new Promise(function(resolve) {
        var channel = new MessageChannel();
        var timer = setTimeout(function() { channel.port1.close(); resolve(null); }, 1500);
        channel.port1.onmessage = function(event) {
          clearTimeout(timer); channel.port1.close(); resolve(event.data);
        };
        worker.postMessage({type: 'KW_CACHE_INIT', protocol: 1, release: release, inventory: results[1]}, [channel.port2]);
      });
    })(), 3500) || {enabled: false, reason: 'cache-timeout'};
  }
  return {checked: checked, connect: connect};
}

  var base = new URL('/kingdom-watch-play/',location.origin);
  var status = document.getElementById('kwLoad'), retry = document.getElementById('kwRetry'), problem = document.getElementById('kwProblem');
  var starting=false, canResume=false;
  function scoped(path){
    var u=new URL(path,base);
    if(u.origin!==base.origin || !u.pathname.startsWith(base.pathname) || /[?#]/.test(path)) throw new Error('发布路径不合法');
    return u;
  }
  function retryDelay(ms){return new Promise(function(resolve){
    function resume(){clearTimeout(timer);window.removeEventListener('online',resume);resolve();}
    var timer=setTimeout(resume,ms);window.addEventListener('online',resume,{once:true});
  });}
  async function network(url){
    for(var attempt=0;attempt<3;attempt++){
      var ctl=new AbortController(), timer=setTimeout(function(){ctl.abort();},20000);
      try {
        var r=await fetch(url,{cache:'no-store',signal:ctl.signal,credentials:'same-origin'});
        if(!r.ok){var http=new Error('HTTP '+r.status);http.permanent=r.status<500&&r.status!==408&&r.status!==429;throw http;}
        return await r.arrayBuffer();
      } catch(e){
        e.networkFailure=true;
        if(e.permanent||attempt===2)throw e;
      } finally{clearTimeout(timer);}
      await retryDelay(1000*(attempt+1));
    }
  }
  async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  var runtimeCache=createRuntimeCache(base,network,hash);
  async function start(){
    if(starting)return;
    starting=true;canResume=false;
    retry.hidden=true;problem.hidden=true;
    try {
      if(!window.isSecureContext || !crypto.subtle)throw new Error('请使用 HTTPS 和支持安全校验的现代浏览器');
      var manifestUrl=scoped('hosting-release.json');manifestUrl.searchParams.set('check',Date.now());
      var m=JSON.parse(new TextDecoder().decode(await network(manifestUrl)));
      if(m.schema!==1 || m.base_path!==base.pathname || !/^[a-f0-9]{64}$/.test(m.entry_sha256) || !/^game\.[a-f0-9]{16}\.html$/.test(m.entry) ||
         !/^[a-f0-9]{64}$/.test(m.inventory_sha256) || m.id!==m.inventory_sha256.slice(0,16) || m.inventory!=='hosting-files.'+m.id+'.json' ||
         !Number.isSafeInteger(m.entry_bytes) || m.entry_bytes<=0 || !Number.isSafeInteger(m.inventory_bytes) || m.inventory_bytes<=0 || m.inventory_bytes>2*1024*1024)throw new Error('版本清单不完整');
      if(m.requires_cross_origin_isolation && !crossOriginIsolated)throw new Error('此版本需要跨源隔离，当前托管环境尚未满足');
      if(m.requires_webp && !await supportsLosslessWebP())throw new Error('当前浏览器不支持无损 WebP 图片，请升级浏览器或在系统浏览器打开');
      var cacheReady=runtimeCache.connect(m);
      var bytes=await runtimeCache.checked(m.entry,{sha256:m.entry_sha256,bytes:m.entry_bytes});
      window.__KWRuntimeCache=await cacheReady;
      // The address remains the fixed project URL. The verified original Cocos
      // document supplies its explicit project base before any engine script.
      window.removeEventListener('online',resumeStart);
      document.open();document.write(new TextDecoder().decode(bytes));document.close();
    } catch(e){
      canResume=!!e.networkFailure&&!e.permanent;
      status.textContent=e.networkFailure
        ? (navigator.onLine===false?'网络已断开，连接恢复后会重试。':e.permanent?'游戏文件暂时无法下载（'+e.message+'），请稍后重试。':'连接中断或超时，请检查网络或VPN后重试。')
        : '游戏尚未加载：'+e.message;
      retry.hidden=false;problem.hidden=false;
    } finally{starting=false;}
  }
  function resumeStart(){if(canResume&&!problem.hidden)start();}
  window.addEventListener('online',resumeStart);
  retry.onclick=start;start();
})();
</script></body></html>
